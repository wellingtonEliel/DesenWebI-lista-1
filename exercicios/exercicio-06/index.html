<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de Informática</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="../images/favicon.png" type="image/png">
</head>
<body>
    <!-- Navegação -->
    <nav>
        <a href="index.html">Home</a>
        <a href="cart.html">Carrinho</a>
        <a href="checkout.html">Checkout</a>
    </nav>

    <!-- Conteúdo Principal -->
    <main>
        <h1>Casa do Computador</h1>

        <!-- Campo de Busca e Filtros -->
        <section class="search-filters">
            <input type="text" id="search" placeholder="Buscar produtos..." oninput="filterProducts()">
            <select id="category-filter" onchange="filterProducts()">
                <option value="">Todas as Categorias</option>
                <option value="Notebook">Notebook</option>
                <option value="Monitor">Monitor</option>
                <option value="Teclado">Teclado</option>
            </select>
            <select id="brand-filter" onchange="filterProducts()">
                <option value="">Todas as Marcas</option>
                <option value="Dell">Dell</option>
                <option value="LG">LG</option>
                <option value="HyperX">HyperX</option>
            </select>
        </section>

        <!-- Lista de Produtos -->
        <section id="product-list" class="product-list">
            <!-- Os produtos serão carregados aqui pelo JavaScript -->
        </section>
    </main>

    <!-- Rodapé -->
    <footer>
        <p>Casa do Computador @2024 - Todos os direitos reservados</p>
    </footer>

    <!-- Scripts -->
    <script src="js/main.js"></script>
</body>
</html>
